{{- $group := .group -}}
{{- $index := .index -}}
<section class="tool-group" id="{{ $group.id }}" aria-labelledby="group-{{ $group.id }}">
    <div class="group-head">
        <span class="gid">{{ printf "%02d" $index }}</span>
        <h3 id="group-{{ $group.id }}">{{ $group.name }}</h3>
        <p>{{ $group.summary }}</p>
    </div>
    <ol class="tool-list">
        {{- range $j, $tool := $group.tools }}
            {{ partial "tool-row.html" (dict "tool" $tool "index" (add $j 1)) }}
        {{- end }}
    </ol>
</section>
