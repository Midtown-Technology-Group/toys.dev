{{- $install := hugo.Data.install -}}
<section class="install-band" id="install" aria-labelledby="install-title">
    <div class="section-heading">
        <p class="eyebrow">{{ $install.eyebrow }}</p>
        <h2 id="install-title">{{ $install.heading }}</h2>
        <p>{{ $install.intro }}</p>
    </div>
    <div class="install-grid">
        {{- range $install.examples }}
        <article>
            <h3>{{ .title }}</h3>
            <pre><code>{{ .code }}</code></pre>
        </article>
        {{- end }}
    </div>
</section>
