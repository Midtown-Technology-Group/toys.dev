{{- $tool := .tool -}}
{{- $index := .index -}}
<li class="tool-row" id="toy-{{ $tool.id }}">
    <span class="tool-index">{{ printf "%02d" $index }}</span>
    <span class="tool-name">{{ $tool.name }}</span>
    <span class="tool-desc">{{ $tool.description }}</span>
    <span class="tool-tags">{{ delimit $tool.tags " · " }}</span>
    <span class="tool-command"><span class="prompt">$</span> {{ $tool.command }}</span>
    <a class="tool-repo" href="{{ $tool.repo }}">Repo <span aria-hidden="true">&#8599;</span></a>
</li>
