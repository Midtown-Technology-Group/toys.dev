eyebrow: Run paths
heading: Install Notes
intro: Most tools are source-first for now. We only list a package here once we've proven the install path.
examples:
  - title: From source
    code: |-
      git clone https://github.com/Midtown-Technology-Group/todo.git
      cd todo
      py -3 -m venv .venv
      .\.venv\Scripts\python.exe -m pip install --upgrade pip
      .\.venv\Scripts\python.exe -m pip install -e .[dev]
  - title: Private WinGet pilot
    code: |-
      winget source add -n mtg-tools -a https://wonderful-pond-03cdbc40f.7.azurestaticapps.net
      winget source update

      # todo is published in the private feed at 0.1.1
