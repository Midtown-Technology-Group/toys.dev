groups:
  - name: Microsoft 365 and PSA
    id: graph
    summary: Graph, Halo, inbox, calendar, files
    tools:
      - name: Todo
        initials: TD
        accent: green
        description: Microsoft To Do companion built on shared auth, live-verified with WAM and delegated task scopes.
        tags: [Python, Tasks.Read]
        command: todo --help
        repo: https://github.com/Midtown-Technology-Group/todo
      - name: Mail Triage
        initials: MT
        accent: blue
        description: Inbox triage with compact JSON output for notification and follow-up workflows.
        tags: [Python, Mail.ReadBasic]
        command: .\invoke.ps1 inbox
        repo: https://github.com/Midtown-Technology-Group/mail-triage
      - name: Calendar Glance
        initials: CG
        accent: blue
        description: Read-only agenda snapshots for short-range planning and meeting context.
        tags: [Python, Calendars.Read]
        command: .\invoke.ps1 agenda
        repo: https://github.com/Midtown-Technology-Group/calendar-glance
      - name: Communication Style
        initials: CS
        accent: teal
        featured: true
        description: Build local style guides from Teams and Sent Items, including era and participant-focused cuts.
        tags: [Python, Teams, Mail]
        command: communication-style --help
        repo: https://github.com/Midtown-Technology-Group/communication-style
      - name: File Finder
        initials: FF
        accent: green
        description: Microsoft 365 file discovery and focused OneDrive actions through delegated Graph.
        tags: [Python, OneDrive]
        command: file-finder --help
        repo: https://github.com/Midtown-Technology-Group/file-finder
      - name: Halo CLI
        initials: HC
        accent: amber
        description: Standalone HaloPSA command line workflows for safe operator and automation use.
        tags: [Python, HaloPSA]
        command: halocli --help
        repo: https://github.com/Midtown-Technology-Group/halocli
      - name: Meeting Cost Tracker
        initials: MC
        accent: teal
        description: Calculate the real cost of Teams meetings from participant time and hourly rates.
        tags: [Python, Analytics]
        command: meeting-cost-tracker --help
        repo: https://github.com/Midtown-Technology-Group/meeting-cost-tracker
      - name: Meeting Extractor
        initials: ME
        accent: blue
        description: Extract decisions and action items from Microsoft Teams transcripts.
        tags: [Python, Teams]
        command: meeting-extractor --help
        repo: https://github.com/Midtown-Technology-Group/meeting-extractor

  - name: Workflow, Notes, and Reporting
    id: workflow
    summary: Capture, review, analysis, documentation
    tools:
      - name: Quick Capture
        initials: QC
        accent: green
        description: Fast capture into notes and workflows with short command aliases intact.
        tags: [Python, Notes]
        command: quick-capture --help
        repo: https://github.com/Midtown-Technology-Group/quick-capture
      - name: Detour
        initials: DT
        accent: amber
        description: Track work detours in daily Markdown notes so side work stays visible.
        tags: [CLI, Markdown]
        command: detour --help
        repo: https://github.com/Midtown-Technology-Group/detour
      - name: SOP Generator
        initials: SG
        accent: teal
        description: Turn Greenshot screenshot runs into step-by-step IT documentation.
        tags: [Python, Docs]
        command: sop-generator --help
        repo: https://github.com/Midtown-Technology-Group/sop-generator
      - name: Time Tracker
        initials: TT
        accent: blue
        description: Track task time with low friction for MSP work logs and daily-note evidence.
        tags: [Python, CLI]
        command: time-tracker --help
        repo: https://github.com/Midtown-Technology-Group/time-tracker
      - name: GTD Dashboard
        initials: GD
        accent: green
        description: Unified task view across Logseq notes, including waiting-for aging analysis.
        tags: [Python, GTD]
        command: gtd-dashboard --help
        repo: https://github.com/Midtown-Technology-Group/gtd-dashboard
      - name: Link Validator
        initials: LV
        accent: amber
        description: Validate knowledge graph links and catch broken wiki-link references.
        tags: [Python, Quality]
        command: link-validator --help
        repo: https://github.com/Midtown-Technology-Group/link-validator
      - name: Topic Trends
        initials: TR
        accent: teal
        description: Analyze knowledge notes for topics that are heating up, cooling down, or expanding.
        tags: [Python, Analytics]
        command: topic-trends --help
        repo: https://github.com/Midtown-Technology-Group/topic-trends
      - name: Weekly Review
        initials: WR
        accent: blue
        description: Generate GTD weekly reviews from daily notes and work context.
        tags: [Python, Reports]
        command: weekly-review --help
        repo: https://github.com/Midtown-Technology-Group/weekly-review

  - name: Shared Plumbing
    id: plumbing
    summary: Auth, sync, packaging, secure local support
    tools:
      - name: Shared Microsoft Auth
        initials: SA
        accent: blue
        featured: true
        description: Reusable WAM-first auth package for Graph tools with common cache behavior.
        tags: [MSAL, WAM]
        command: mtg-microsoft-auth
        repo: https://github.com/Midtown-Technology-Group/mtg-microsoft-auth
      - name: Context Sync
        initials: CX
        accent: teal
        description: Mature graph-connected reference implementation for shared Microsoft 365 auth.
        tags: [Python, Graph]
        command: work-context-sync --help
        repo: https://github.com/Midtown-Technology-Group/context-sync
      - name: Keeper PowerCommander Vault
        initials: KV
        accent: amber
        description: PowerShell SecretManagement vault backed by Keeper PowerCommander.
        tags: [PowerShell, Keeper]
        command: Install-Module
        repo: https://github.com/Midtown-Technology-Group/SecretManagement.KeeperPowerCommander

